[package]
name = "mink-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `mink` binary: serve a node, administer tables, read and write from the shell"
repository.workspace = true

[[bin]]
name = "mink"
path = "src/main.rs"

[dependencies]
mink-common = { workspace = true }
mink-client = { workspace = true }
mink-record = { workspace = true }
mink-runtime = { workspace = true }
mink-table = { workspace = true }
mink-types = { workspace = true }

anyhow = { workspace = true }
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-json = { workspace = true }
arrow-schema = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["signal", "io-std"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
