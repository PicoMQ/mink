services:
  certs:
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache openssl >/dev/null && /auth/generate.sh"]
    volumes:
      - ./auth:/auth
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    container_name: mink-postgres
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: mink
      POSTGRES_PASSWORD: mink
      POSTGRES_DB: mink
    command:
      - bash
      - -c
      - >-
        install -o postgres -m 600 /auth/server.key /tmp/server.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/auth/server.pem -c ssl_key_file=/tmp/server.key
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./auth:/auth:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mink -d mink"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    container_name: mink-rustfs
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: mink
      RUSTFS_SECRET_KEY: minkminkmink
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli:2.27.50
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: mink
      AWS_SECRET_ACCESS_KEY: minkminkmink
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3 mb s3://mink 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3 ls s3://mink >/dev/null
    restart: "no"

  kafka:
    image: apache/kafka:3.9.1
    container_name: mink-kafka
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093,TLS://:9094,SASL_TLS://:9095,SASL_PLAINTEXT://:9096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092,TLS://kafka:9094,SASL_TLS://kafka:9095,SASL_PLAINTEXT://kafka:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT,TLS:SSL,SASL_TLS:SASL_SSL,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /auth/kafka.pem
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
      KAFKA_OPTS: -Djava.security.auth.login.config=/auth/kafka.jaas
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./auth:/auth:ro
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  createusers:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for mechanism in SCRAM-SHA-256 SCRAM-SHA-512; do
          /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9092 --alter \
            --entity-type users --entity-name mink --add-config "$$mechanism=[password=mink-secret]" || exit 1
        done
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.1
    container_name: mink-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/subjects >/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  pg-data:
  rustfs-data:
