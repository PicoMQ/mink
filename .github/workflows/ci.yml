name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_POSTGRES_URL: postgres://mink:mink@localhost:5432/mink
      TEST_KAFKA_BOOTSTRAP: localhost:29092
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_SCHEMA_REGISTRY: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config libcurl4-openssl-dev
      - name: start the compose stack the tests run against
        run: |
          docker compose -f harness/compose.yml up -d --wait kafka postgres rustfs schema-registry
          docker compose -f harness/compose.yml run --rm createbucket
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --locked
